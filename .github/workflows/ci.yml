name: Validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Save catalog meanings are checked against every committed generation.
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci
      - run: npm run check
        env:
          LITTLE_ISLAND_WORD_POLICY_JSON: ${{ secrets.LITTLE_ISLAND_WORD_POLICY_JSON }}
      - name: Guard the actual web export
        run: npm run check:words:export
        env:
          LITTLE_ISLAND_WORD_POLICY_JSON: ${{ secrets.LITTLE_ISLAND_WORD_POLICY_JSON }}
      - run: npm run doctor
