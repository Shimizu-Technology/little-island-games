name: Validate
on:
  pull_request:
  push:
    branches: [main, p4/w1-words]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Full history, so the shallow-repository guard passes.
      # The catalog gates compare against what is published at these tips and stop if either is missing.
      - name: Fetch the published refs
        run: git fetch --no-tags origin +refs/heads/program/4.0:refs/remotes/origin/program/4.0 +refs/heads/main:refs/remotes/origin/main
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci
      - run: npm run check:source
      - name: Guard the actual web export
        run: npm run check:words:export
        env:
          LITTLE_ISLAND_WORD_POLICY_GZIP_BASE64: ${{ secrets.LITTLE_ISLAND_WORD_POLICY_GZIP_BASE64 }}
          LITTLE_ISLAND_WORD_POLICY_GZIP_BASE64_2: ${{ secrets.LITTLE_ISLAND_WORD_POLICY_GZIP_BASE64_2 }}
      - run: npm run doctor
